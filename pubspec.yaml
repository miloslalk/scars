name: when_scars_become_art
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.4+15

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cloud_functions: ^5.6.2
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_storage: ^12.3.0
  firebase_database: ^11.1.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  audioplayers: ^6.1.0
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10
  flutter_timezone: ^4.1.1
  intl: ^0.20.0
  table_calendar: ^3.1.2
  flutter_colorpicker: ^1.1.0
  video_player: ^2.11.0
  fvp: ^0.35.2
  url_launcher: ^6.3.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/logo_no_text.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/logo.png
  android: true
  ios: true
  color_dark: "#1A1A2E"
  image_dark: assets/icons/logo.png

