org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.ndk.suppressMinSdkVersionError=21

# Let android/app/build.gradle.kts ndk.abiFilters be the single source of truth
# for included ABIs. Without this, Flutter's Gradle plugin unions x86_64 into
# abiFilters, undoing our exclusion of emulator-only architectures.
disable-abi-filtering=true

# AGP 9 compatibility: keep the classic kotlin-android plugin and DSL until
# Flutter's built-in Kotlin migration applies (needs a newer Flutter than 3.41).
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.builtInKotlin=false
android.newDsl=false
